<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr Jayesh Gohil Vet Clinic - Online Consultation</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen pb-12">

    <div class="max-w-2xl mx-auto bg-white min-h-screen shadow-xl rounded-2xl overflow-hidden">
        
        <!-- Header / Banner -->
        <div class="bg-blue-600 text-white p-6 text-center">
            <h1 class="text-2xl font-bold">ડૉ. જયેશ ગોહિલ વેટ ક્લિનિક</h1>
            <p class="text-sm mt-1 text-blue-100">ઓનલાઈન પશુ ચિકિત્સા અને માર્ગદર્શન કેન્દ્ર</p>
        </div>

        <!-- Appointment Form -->
        <div class="p-5">
            <form id="appointmentForm" class="space-y-4">
                
                <!-- Owner Name -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">પશુપાલકનું નામ:</label>
                    <input type="text" id="ownerName" placeholder="તમારું નામ લખો..." class="w-full p-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <!-- Mobile Number -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">મોબાઈલ નંબર (WhatsApp):</label>
                    <input type="tel" id="mobileNo" placeholder="મોબાઈલ નંબર લખો..." class="w-full p-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <!-- Location / Village -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">ગામ / શહેર:</label>
                    <input type="text" id="location" placeholder="તમારા ગામનું નામ લખો..." class="w-full p-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <!-- Animal Type -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">પશુનો પ્રકાર:</label>
                    <input type="text" id="animalType" placeholder="ગાય, ભેંસ, શ્વાન વગેરે..." class="w-full p-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <!-- Problem Details -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">પશુને શું તકલીફ છે તે લખો...</label>
                    <textarea id="problemDetails" rows="3" placeholder="સમસ્યા અહીં વિગતવાર લખો..." class="w-full p-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <!-- Case Type & Payment Selection -->
                <div class="border border-gray-300 p-4 rounded-xl bg-gray-50">
                    <label class="block text-xs font-bold text-gray-700 mb-2">કેસનો પ્રકાર પસંદ કરો (Appointment Fee):</label>
                    
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <label class="flex items-center p-3 border border-gray-300 rounded-xl bg-white cursor-pointer hover:border-blue-500 transition">
                            <input type="radio" name="casetype" value="200" checked class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2 text-xs font-bold text-gray-800">જનરલ કેસ<br><span class="text-blue-600 font-extrabold">₹ 200 /-</span></span>
                        </label>

                        <label class="flex items-center p-3 border border-gray-300 rounded-xl bg-white cursor-pointer hover:border-blue-500 transition">
                            <input type="radio" name="casetype" value="300" class="w-4 h-4 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2 text-xs font-bold text-gray-800">ઇમરજન્સી કેસ<br><span class="text-red-600 font-extrabold">₹ 300 /-</span></span>
                        </label>
                    </div>

                    <p class="text-[11px] text-center text-gray-600 mb-2">ઉપરોક્ત ફી ચૂકવવા નીચેના QR Code ને સ્કેન કરો અથવા Pay Now બટન દબાવો.</p>

                    <!-- QR Code & Smart Pay Now Button Block -->
                    <div class="flex justify-center my-2">
                        <div class="bg-white p-3 border border-gray-300 rounded-xl text-center shadow-sm w-full max-w-xs">
                            <!-- QR Code IMG -->
                            <img id="qrCodeImg" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=upi://pay?pa=9825088959@okbizaxis&pn=Dr%20Jayesh%20Gohil&am=200&cu=INR" class="mx-auto">
                            <span class="text-[10px] text-gray-500 mt-1 block">Google Pay / PhonePe / Paytm</span>
                            
                            <!-- Smart Pay Now Button -->
                            <a id="payNowBtn" href="upi://pay?pa=9825088959@okbizaxis&pn=Dr%20Jayesh%20Gohil&am=200&cu=INR" 
                               class="mt-2.5 inline-block w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 px-3 rounded-lg shadow transition text-center">
                               💳 Pay Now (₹200)
                            </a>
                        </div>
                    </div>
                </div>

                <!-- WhatsApp Submit Button Section -->
                <div class="mt-4 p-3 bg-amber-50 rounded-xl text-center border border-amber-200">
                    <p class="text-[11px] text-gray-600 mb-2">પેમેન્ટ પૂર્ણ કર્યા બાદ આપની તમામ વિગત ડૉક્ટરશ્રીને વોટ્સએપથી મોકલવા માટે નીચેનું બટન દબાવો.</p>
                    <button type="button" onclick="sendWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-4 rounded-xl shadow transition flex items-center justify-center gap-2 text-sm">
                        <i class="fa-brands fa-whatsapp text-xl"></i> વોટ્સએપ પર વિગત મોકલો
                    </button>
                </div>

            </form>
        </div>

    </div>

    <!-- JavaScript for Dynamic UPI Payment & WhatsApp Integration -->
    <script>
        function updatePaymentAmount() {
            const selectedRadio = document.querySelector('input[name="casetype"]:checked');
            const amount = selectedRadio ? selectedRadio.value : "200";
            
            const upiID = "9825088959@okbizaxis";
            const name = "Dr%20Jayesh%20Gohil";
            
            const upiLink = `upi://pay?pa=${upiID}&pn=${name}&am=${amount}&cu=INR`;
            
            // Update Pay Now Button
            const payBtn = document.getElementById('payNowBtn');
            if (payBtn) {
                payBtn.href = upiLink;
                payBtn.innerText = `💳 Pay Now (₹${amount})`;
            }
            
            // Update QR Code Image based on selected amount
            const qrImg = document.getElementById('qrCodeImg');
            if (qrImg) {
                qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(upiLink)}`;
            }
        }

        // Trigger amount update when case type changes
        document.querySelectorAll('input[name="casetype"]').forEach(radio => {
            radio.addEventListener('change', updatePaymentAmount);
        });

        // Run on page load
        window.onload = updatePaymentAmount;

        // WhatsApp Form Submission Function
        function sendWhatsApp() {
            const ownerName = document.getElementById('ownerName').value.trim();
            const mobileNo = document.getElementById('mobileNo').value.trim();
            const location = document.getElementById('location').value.trim();
            const animalType = document.getElementById('animalType').value.trim();
            const problemDetails = document.getElementById('problemDetails').value.trim();
            
            const selectedRadio = document.querySelector('input[name="casetype"]:checked');
            const selectedCase = selectedRadio && selectedRadio.value === "300" ? "ઇમરજન્સી કેસ (₹300)" : "જનરල් કેસ (₹200)";

            if (!ownerName || !mobileNo) {
                alert("કૃપા કરીને પશુપાલકનું નામ અને મોબાઈલ નંબર અવશ્ય ભરો.");
                return;
            }

            const doctorNumber = "919825088959";

            const message = `*નવી ઓનલાઈન એપોઇન્ટમેન્ટ*\n` +
                            `1) પશુપાલકનું નામ: ${ownerName}\n` +
                            `2) મોબાઈલ નંબર: ${mobileNo}\n` +
                            `3) ગામ / શહેર: ${location}\n` +
                            `4) પશુનો પ્રકાર: ${animalType}\n` +
                            `5) સમસ્યાની વિગત: ${problemDetails}\n` +
                            `6) કેસનો પ્રકાર: ${selectedCase}\n\n` +
                            `મેં પેમેન્ટ પૂર્ણ કરેલ છે. કૃપા કરીને એપોઇન્ટમેન્ટ કન્ફર્મ કરો.`;

            const whatsappUrl = `https://wa.me/${doctorNumber}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
